name: Foundation Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # -----------------------------------------------------------------
  # SMART GATE: detect whether this PR/push touches the governed scope.
  # Governed scope (must ALWAYS trigger full validation):
  #   schemas/**, policies/**, templates/**, .spectral.yaml,
  #   scripts/**, .github/workflows/**, docs/adr/**
  # -----------------------------------------------------------------
  changes:
    name: Detect Governed Scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      governed: ${{ steps.filter.outputs.governed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            governed:
              - 'schemas/**'
              - 'policies/**'
              - 'templates/**'
              - '.spectral.yaml'
              - 'scripts/**'
              - '.github/workflows/**'
              - 'docs/adr/**'

  # -----------------------------------------------------------------
  # HARD GATE: cheap repo-hygiene checks. Runs unconditionally on
  # every push and every pull_request. No `if:` on this job.
  # -----------------------------------------------------------------
  hard-gate:
    name: Hard Gate
    runs-on: ubuntu-latest
    # NOTE: intentionally no `needs: changes` here. Hard Gate must run
    # unconditionally on every push/PR, even if the `changes` job
    # (path-filter) itself fails or errors. Making it depend on `changes`
    # would let a broken/blocked filter step silently skip Hard Gate too.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Required Files
        run: |
          echo "Checking required repository files..."
          required_files=(
            "README.md"
            "LICENSE"
            "CHANGELOG.md"
            "ROADMAP.md"
            "VERSION"
            "MASTER_INDEX.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
            "CODE_OF_CONDUCT.md"
            "SUPPORT.md"
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            else
              echo "✅ Found: $file"
            fi
          done

      - name: Check GitHub Configuration
        run: |
          github_files=(
            ".github/workflows"
            ".github/ISSUE_TEMPLATE"
            ".github/CODEOWNERS"
            ".github/PULL_REQUEST_TEMPLATE.md"
          )
          for file in "${github_files[@]}"; do
            if [ ! -e "$file" ]; then
              echo "❌ Missing: $file"
              exit 1
            else
              echo "✅ Found: $file"
            fi
          done

      - name: Hard Gate Summary
        run: echo "✅ Hard Gate passed (unconditional checks)!"

  # -----------------------------------------------------------------
  # FULL VALIDATION: heavy schema/spec/script/ADR checks.
  # Runs only when the governed scope was touched, OR on any push
  # event (push = already merged into a protected branch, so we
  # validate fully regardless of which paths changed, as
  # defense-in-depth against a workflow file that was altered
  # outside the PR review flow).
  # -----------------------------------------------------------------
  full-validation:
    name: Full Validation (governed scope)
    runs-on: ubuntu-latest
    needs: changes
    # always() so this job still evaluates even if `changes` failed/errored.
    # Fail-safe: if the path-filter job itself couldn't determine the scope
    # (result != 'success'), we treat it as governed and run full validation
    # rather than silently skipping.
    if: |
      always() &&
      (needs.changes.result != 'success' ||
       needs.changes.outputs.governed == 'true' ||
       github.event_name == 'push')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install validation tools
        run: |
          npm install -g @stoplight/spectral-cli ajv-cli ajv-formats

      - name: Validate JSON Schemas
        run: |
          echo "Validating canonical schemas..."
          for schema in schemas/canonical/*.schema.json; do
            echo "Checking $schema"
            ajv compile -s "$schema" --spec=draft2020 -c ajv-formats --strict
          done

      - name: Validate OpenAPI Specs
        run: |
          echo "Validating API templates..."
          spectral lint schemas/api/*.yaml --ruleset .spectral.yaml

      - name: Check Naming Conventions
        run: |
          echo "Checking file naming conventions..."
          bash scripts/validate.sh

      - name: Validate ADR Format
        run: |
          echo "Checking ADR files..."
          for adr in docs/adr/*.md; do
            if [ -f "$adr" ] && [ "$(basename "$adr")" != "README.md" ]; then
              if ! grep -q "## Status" "$adr"; then
                echo "❌ ADR missing Status section: $adr"
                exit 1
              fi
              if ! grep -q "## Decision" "$adr"; then
                echo "❌ ADR missing Decision section: $adr"
                exit 1
              fi
              echo "✅ Valid ADR: $(basename $adr)"
            fi
          done

      - name: Summary
        run: echo "✅ All foundation validations passed!"
