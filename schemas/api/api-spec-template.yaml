openapi: 3.0.3
info:
  title: CloudForge Studio API
  description: |
    API specification template for CloudForge Studios.
    All Studios must follow this structure and conventions.
  version: 1.0.0
  contact:
    name: CloudForge Team
    email: team@cloudforge.example.com

servers:
  - url: https://api.cloudforge.example.com/v1
    description: Production
  - url: https://api-staging.cloudforge.example.com/v1
    description: Staging

# Common components that all Studios should reuse
components:
  schemas:
    BaseEntity:
      $ref: "../canonical/entity.schema.json"

    BaseEvent:
      $ref: "../canonical/event.schema.json"

    ErrorResponse:
      type: object
      required:
        - error
        - message
        - requestId
      properties:
        error:
          type: string
          description: Error code in SCREAMING_SNAKE_CASE
          example: INVALID_REQUEST
        message:
          type: string
          description: Human-readable error message
          example: The request payload is invalid
        requestId:
          type: string
          format: uuid
          description: Unique ID for tracing this error
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string

    Pagination:
      type: object
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        totalItems:
          type: integer
          minimum: 0
          example: 150
        totalPages:
          type: integer
          minimum: 0
          example: 8

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from CloudForge Identity Service

    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for service-to-service communication

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number for pagination

    PageSizeParam:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Number of items per page

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

security:
  - BearerAuth: []

# Studio-specific paths go below
tags:
  - name: Health
    description: Health check endpoints

paths:
  /health:
    get:

      tags:
        - Health
      summary: Health check
      description: Returns service health status
      security: []  # Public endpoint
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  version:
                    type: string
                    example: "1.2.3"
                  timestamp:
                    type: string
                    format: date-time
