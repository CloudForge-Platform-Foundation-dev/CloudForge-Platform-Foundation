name: Validate Against Foundation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  foundation-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Studio
        uses: actions/checkout@v4

      - name: Checkout Foundation
        uses: actions/checkout@v4
        with:
          repository: CloudForge-Platform-Foundation-dev/CloudForge-Platform-Foundation
          path: foundation
          # CloudForge-Platform-Foundation is a private repo, so the default
          # GITHUB_TOKEN (scoped only to this repo) cannot check it out.
          # Each Studio repo must add a fine-grained PAT with read-only
          # 'contents' access to CloudForge-Platform-Foundation as a repo
          # secret named FOUNDATION_PAT.
          token: ${{ secrets.FOUNDATION_PAT }}

      - name: Setup validation tools
        run: |
          npm install -g ajv-cli ajv-formats

      - name: Run Studio Contract Validation
        run: |
          bash foundation/scripts/validate-studio.sh .

      - name: Validate Against Canonical Schemas
        run: |
          set -euo pipefail
          if [ ! -d "src/schemas" ]; then
            echo "No src/schemas/ directory found in this Studio yet — nothing to validate."
            exit 0
          fi
          shopt -s nullglob
          schema_files=(src/schemas/*.json)
          if [ ${#schema_files[@]} -eq 0 ]; then
            echo "src/schemas/ exists but contains no .json files — nothing to validate."
            exit 0
          fi
          failed=0
          for schema in "${schema_files[@]}"; do
            echo "Checking $schema"
            # --spec=draft2020 and -c ajv-formats mirror the Foundation repo's own
            # canonical schema checks (see scripts/validate.sh), so a Studio schema
            # is held to the same bar as the canonical schemas it's meant to extend.
            # If a schema $refs a canonical schema under foundation/schemas/canonical/,
            # ajv resolves that $ref for real here too — a broken or missing $ref
            # fails this step instead of silently compiling around it.
            if ajv compile -s "$schema" --spec=draft2020 -c ajv-formats --strict; then
              echo "✅ Valid: $schema"
            else
              echo "❌ Invalid: $schema"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more Studio schemas failed validation."
            exit 1
          fi

      - name: API Governance Gate (OpenAPI)
        run: |
          set -euo pipefail
          # Studios are expected to publish their API contract at openapi.yaml
          # (repo root), matching the convention used across the platform.
          # A Studio with no API surface yet has nothing to validate.
          if [ ! -f "openapi.yaml" ] && [ ! -f "openapi.json" ]; then
            echo "No openapi.yaml/openapi.json found in this Studio yet — nothing to validate."
            exit 0
          fi
          spec="openapi.yaml"
          [ -f "$spec" ] || spec="openapi.json"

          npm install -g @stoplight/spectral-cli

          # Lint against the Foundation's OWN .spectral.yaml (SSOT per ADR-003),
          # not a copy — this is the ruleset CloudForge already defines
          # (cloudforge-security-schemes, operation-tags, operation-description,
          # plus the inherited spectral:oas / spectral:asyncapi base rules) but
          # which nothing was previously running against Studio API contracts.
          spectral lint "$spec" --ruleset foundation/.spectral.yaml --fail-severity=error

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: table
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"
